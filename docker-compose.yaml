services:
  mini-msgboard:
    container_name: mini-msgboard
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "51111:51111"
    networks:
      - vpn_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://mini-msgboard:51111/"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Extra security:
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5

networks:
  vpn_net:
    external: true
